name: Build Feather (multi-profile signing)

# Builds this fork's Feather and publishes Feather.ipa as a pre-release, so it can
# be downloaded on an iPhone and installed by signing it with an existing Feather.

on:
  push:
    branches: [multi-profile-signing, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # The xcode-27 image has had reliable runner availability.
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version

      # Each build gets its own visible version (2.9.0 -> 2.9.<run>), because
      # Feather's update check compares versions: with a fixed 2.9.0 it would
      # never see a newer build of itself.
      - name: Version
        run: |
          BASE=$(grep '^FEATHER_PROJECT_VERSION=' Feather.xcconfig | cut -d= -f2)
          VERSION="${BASE%.*}.${{ github.run_number }}"
          sed -i '' "s/^FEATHER_PROJECT_VERSION=.*/FEATHER_PROJECT_VERSION=$VERSION/" Feather.xcconfig
          grep '^FEATHER_PROJECT_VERSION=' Feather.xcconfig
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build
        run: |
          set -o pipefail
          agvtool new-version -all ${{ github.run_number }}
          make iphoneos 2>&1 | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)|\*\* " || true
          test -f packages/Feather.ipa

      - name: Show compiler errors
        if: failure()
        run: grep -E "error:" -B2 -A3 build.log | head -150 || true

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: multi-profile-${{ github.run_number }}
          name: Feather multi-profile build ${{ github.run_number }}
          prerelease: true
          make_latest: false
          body: |
            Feather with per-bundle provisioning profiles for app extensions
            (branch `${{ github.ref_name }}`, commit ${{ github.sha }}).

            Version ${{ env.APP_VERSION }}.

            Install: download Feather.ipa on your iPhone and sign it with your current Feather.
            Then open a certificate in Settings → Certificates and use **Add Extension Profile**.
          files: packages/Feather.ipa

      # A source at a fixed address that always lists the newest build, so Feather
      # can update itself (Update & Install, or Sign Updates Automatically):
      # https://github.com/<owner>/<repo>/releases/download/feather-source/feather-source.json
      - name: Write Feather source
        run: |
          python3 .github/scripts/feather_source.py "${{ github.repository }}" "$APP_VERSION" \
            "${{ github.run_number }}" "multi-profile-${{ github.run_number }}" \
            packages/Feather.ipa feather-source.json

      - name: Publish Feather source
        uses: softprops/action-gh-release@v2
        with:
          tag_name: feather-source
          name: Feather source (always the newest build)
          prerelease: true
          make_latest: false
          overwrite_files: true
          body: |
            Add this source in Feather to get this fork's updates:
            https://github.com/${{ github.repository }}/releases/download/feather-source/feather-source.json
          files: feather-source.json
